name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "=== Checking required files ==="
          ls -la
          test -f main.py || (echo "ERROR: main.py missing" && exit 1)
          test -f buildozer.spec || (echo "ERROR: buildozer.spec missing" && exit 1)
          test -f snake.png || (echo "ERROR: snake.png missing" && exit 1)
          test -d assets/images || (echo "ERROR: assets/images missing" && exit 1)
          echo "All required files found."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git zip unzip autoconf automake libtool \
            pkg-config cmake zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libsqlite3-dev libbz2-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython>=3.0.0,<3.1" scons

      - name: Clean old build cache
        run: buildozer appclean || true

      - name: Build APK
        env:
          USE_SDK_WRAPPER: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          # pyjnius er source code purono "long" type use kore, jeta Cython 3.1+
          # e completely remove kora hoyeche. PIP_CONSTRAINT diye amra force
          # kori j pyjnius build korar somoy shudhu Cython 3.0.x use hoy.
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          if ! ls bin/*.apk 1>/dev/null 2>&1; then
            echo "=== BUILD FAILED ==="
            tail -n 80 build.log
            exit 1
          fi

      - name: List built APK files
        run: ls -lh bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShepusSnake-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
